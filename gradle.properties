# Plugin identity. The plugin ID is permanent once uploaded to JetBrains Marketplace - never change it.
pluginId = io.github.prashanthsams.pytesthtmlreporter
pluginGroup = io.github.prashanthsams.pytesthtmlreporter
pluginName = pytest-html-reporter
pluginVersion = 0.1.0
pluginRepositoryUrl = https://github.com/prashanth-sams/pytest-html-reporter-jetbrains

# Oldest supported IDE build: 2025.1 (251). No until-build is set, following the IntelliJ Platform Gradle Plugin's
# guidance for 243+ (an upper bound blocks users from installing the plugin after an IDE update); compatibility with
# new releases is checked by the Plugin Verifier in CI instead (see docs/PUBLISHING.md).
pluginSinceBuild = 251

# Compile against the oldest supported SDK: PyCharm Community 2025.1.6.2 (build 251.29188.66),
# which bundles the PythonCore plugin used by the optional Python integration.
platformVersion = 2025.1.6.2

# IDEs checked by `verifyPlugin`, as TYPE:VERSION pairs (IntelliJPlatformType names).
# Override from the command line, e.g. -PverifyIdes=PyCharm:2026.2.3, to verify one IDE at a time.
verifyIdes = PyCharmCommunity:2025.1.6.2,PyCharmCommunity:2025.2.6.2,PyCharm:2025.3.6.1,PyCharm:2026.1.5,PyCharm:2026.2.3,IntellijIdea:2026.2.3

# Gradle
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8

# The IntelliJ Platform bundles the Kotlin standard library; plugins must not ship their own copy.
kotlin.stdlib.default.dependency = false
