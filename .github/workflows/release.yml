# Publishes to JetBrains Marketplace. Runs only when a GitHub release is published (or when started by hand with
# the confirmation typed in), never on an ordinary push. See docs/PUBLISHING.md for the secrets and the first upload,
# which has to be made by hand on the Marketplace website before this workflow can update the plugin.
name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to sign and upload the current version to JetBrains Marketplace"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Sign and publish
    if: ${{ github.event_name == 'release' || github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check that the release tag matches pluginVersion
        if: ${{ github.event_name == 'release' }}
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d= -f2- | tr -d ' ')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pluginVersion $version" >&2
            exit 1
          fi

      - name: Test, sign and publish
        run: xvfb-run --auto-servernum ./gradlew :test :verifyPluginStructure :signPlugin :publishPlugin --console=plain
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Attach the signed ZIP to the GitHub release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*-signed.zip
